name: android

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build web
        run: |
          npx tsc --noEmit
          npx vitest run
          npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure a stable signing key
        run: |
          set -e
          if [ -f android/quizz-release.jks ]; then
            echo "Reusing the committed signing key — app updates will keep working."
            exit 0
          fi
          echo "Generating the Quizz signing key (first run)…"
          keytool -genkeypair -v -keystore android/quizz-release.jks -alias quizz \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass quizz-personal-key -keypass quizz-personal-key \
            -dname "CN=Quizz, OU=Personal, O=Quizz, L=Bannu, S=KPK, C=PK"
          git config user.name "Quizz Builder"
          git config user.email "quizz-builder@users.noreply.github.com"
          git add -f android/quizz-release.jks
          if git commit -m "chore(android): add stable release signing key"; then
            git push || echo "::warning::Could not push the signing key; keep it safe for future updates."
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee ../gradle.log
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Inspect the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          echo "build tools: $BUILD_TOOLS"
          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/aapt2" ]; then
            "$BUILD_TOOLS/aapt2" dump badging "$APK" 2>&1 | head -10 || true
          fi
          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1 | head -6 || true
          fi
          unzip -l "$APK" 2>/dev/null | grep -E "assets/public/index.html|\.quizz" | head -6 || true

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          { echo "run: $GITHUB_RUN_NUMBER"; echo "ref: $GITHUB_REF"; 
            echo "--- gradle.log (tail) ---"; tail -150 gradle.log 2>/dev/null || echo "(no gradle.log)";
            echo "--- outputs ---"; find android/app/build/outputs -maxdepth 4 -type f 2>/dev/null | head -40;
          } > ci-logs/build.log
          git config user.name "Quizz Builder"
          git config user.email "quizz-builder@users.noreply.github.com"
          git add -f ci-logs/build.log
          git commit -m "ci: build failure log for run $GITHUB_RUN_NUMBER" || true
          git pull --rebase --autostash || true
          git push || echo "::warning::could not publish the log"
          grep -E "FAILURE|error:|Caused by" ci-logs/build.log | tail -4 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Name the artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Quizz-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quizz-apk
          path: Quizz-*.apk
          retention-days: 90

      - name: Attach APK to a release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Quizz build ${{ github.run_number }}
          body: |
            Installable Android build of Quizz, signed with the project key.

            **Install:** download the `.apk` below, tap it, allow "Install unknown apps"
            for your browser or file manager, then open Quizz.

            Everything runs offline. Tests you save stay on the device across updates.
          files: Quizz-*.apk
          prerelease: false
